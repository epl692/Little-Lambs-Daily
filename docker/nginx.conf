server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  # Re-checked on every visit, or updates are never noticed: the page, the service worker, the manifest, and the unhashed extras
  # (theme script, ZIP tool, QR decoder) and icons.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location ^~ /public/ { add_header Cache-Control "no-cache"; }
  location ^~ /icons/ { add_header Cache-Control "no-cache"; }

  # The built app and its styles carry a content hash in the name (app.AB12CD34.js), so they can be kept for a year.
  location ~ \.[A-Za-z0-9_-]{8}\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri /index.html; }
}
