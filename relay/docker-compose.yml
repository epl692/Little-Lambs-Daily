services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      BLOB_DIR: /data/blobs
      BLOB_TTL_DAYS: "90"
      # BLOB_TOTAL_BYTES: "50000000000"
      # BLOB_PER_SPACE_BYTES: "5000000000"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
